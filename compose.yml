services:

  # Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: retiscan_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB:       ${DB_NAME:-retiscan}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./api/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-retiscan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Almacenamiento MinIO S3
  minio:
    image: minio/minio:latest
    container_name: retiscan_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${S3_ACCESS_KEY:-retiscan}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-retiscan123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Node.js / Express
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: retiscan_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      algorithms:
        condition: service_started
      minio:
        condition: service_started

  # Landing Page
  landing-page:
    build:
      context: ./page
      dockerfile: Dockerfile
    container_name: retiscan_landing
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  # App PWA (Flutter)
  pwa:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: retiscan_pwa
    restart: unless-stopped
    ports:
      - "5174:80"

  # Adminer (UI PostgreSQL)
  adminer:
    image: adminer:latest
    container_name: retiscan_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  # Servicio de IA (Python / FastAPI)
  algorithms:
    build:
      context: ./algorithms
      dockerfile: Dockerfile
    container_name: retiscan_ai
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  pg_data:
    name: retiscan_pg_data
  minio_data:
    name: retiscan_minio_data

